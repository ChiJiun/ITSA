<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>便利商店智慧問答客服</title>
  <link rel="stylesheet" href="team021.css">
</head>
<body data-page="chat">
  <main class="panel">
    <h1>便利商店智慧問答客服</h1>
    <div id="box" class="chat"></div>
    <!-- 用 form 送出：按 Enter 或按鈕都會觸發 submit，輸入法選字時的 Enter 也不會誤送 -->
    <form id="form" class="row">
      <input id="q" placeholder="請輸入您的問題..." autocomplete="off">
      <button class="btn">傳送</button>
    </form>
  </main>
  <script src="team021.js"></script>
</body>
</html>
